name: Music Holo CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend test, build, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music-holo-web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: music-holo-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=moderate
      - name: Mock API integration tests
        run: npm test
      - name: Production build
        run: npm run build

  backend:
    name: Backend compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music-holo-server
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and verify
        shell: bash
        run: |
          set +e
          mvn --batch-mode --no-transfer-progress verify > /tmp/maven-verify.log 2>&1
          status=$?
          cat /tmp/maven-verify.log
          if [ "$status" -ne 0 ]; then
            summary=$(tail -n 18 /tmp/maven-verify.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Maven verify failed::$summary"
          fi
          exit "$status"
