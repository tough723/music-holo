name: Desktop validation
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            music-holo-desktop/package-lock.json
            music-holo-web/package-lock.json
      - run: npm ci --prefix music-holo-web
      - run: npm ci --prefix music-holo-desktop
      - run: npm audit --prefix music-holo-desktop --audit-level=moderate
      - run: npm test --prefix music-holo-desktop
      - run: node --test examples/lx-custom-source/music-holo-local.test.cjs
      - run: npm run build:web --prefix music-holo-desktop
      - name: Electron smoke (real Chromium sandbox, mocked third-party network)
        shell: bash
        run: |
          set +e
          xvfb-run -a npm run test:smoke --prefix music-holo-desktop > /tmp/desktop-smoke.log 2>&1
          status=$?
          cat /tmp/desktop-smoke.log
          if [ "$status" -ne 0 ]; then
            # 渲染进程的 Element Plus 告警会把日志撑得很大，失败原因单独截取。
            if [ -f music-holo-desktop/test-results/failure.txt ]; then
              tail -n 60 music-holo-desktop/test-results/failure.txt >> "$GITHUB_STEP_SUMMARY"
              summary=$(head -c 6000 music-holo-desktop/test-results/failure.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            else
              tail -n 80 /tmp/desktop-smoke.log >> "$GITHUB_STEP_SUMMARY"
              summary=$(tail -n 80 /tmp/desktop-smoke.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            fi
            echo "::error title=Desktop smoke failed::$summary"
          fi
          exit "$status"
      - name: Real online track → Xinghai source playback (non-blocking)
        # Runs only after the guest/no-backend smoke has proved zero backend calls.
        # The live journey then imports a SHA-pinned source, uses real public search IDs,
        # and auto-confirms only the explicit, allowlisted public-domain prompts.
        continue-on-error: true
        shell: bash
        run: |
          set +e
          xvfb-run -a node music-holo-desktop/scripts/live-source-playback.cjs > /tmp/live-source-desktop.log 2>&1
          status=$?
          cat /tmp/live-source-desktop.log
          {
            echo "### 实际在线曲目 → 星海自定义源播放（非阻断）"
            echo
            echo "退出码：$status（0 = Electron 媒体元素真实解码并播放；结果行见下方）"
            echo
            echo '```'
            grep -E 'LIVE_DESKTOP_(STEP|OUTCOME|FINAL)|Error:|failed:' /tmp/live-source-desktop.log | tail -n 50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          outcome=$(grep '^LIVE_DESKTOP_OUTCOME=' /tmp/live-source-desktop.log | tail -n 1 || true)
          if [ -n "$outcome" ]; then
            echo "::notice title=真实在线曲目自定义源播放结果::${outcome#LIVE_DESKTOP_OUTCOME=}"
          else
            detail=$(grep -E 'LIVE_DESKTOP_(STEP|OUTCOME|FINAL)|Error:|failed:' /tmp/live-source-desktop.log | tail -n 25 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::warning title=真实在线榜单自定义源未得出播放结论::$detail"
          fi
          if [ "$status" -ne 0 ]; then
            detail=$(grep -E 'LIVE_DESKTOP_(STEP|OUTCOME|FINAL)|Error:|failed:' /tmp/live-source-desktop.log | tail -n 35 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::warning title=实际在线曲目 → 星海源播放未成功（非阻断）::$detail"
          fi
          exit "$status"
      - name: Production desktop directory packaging
        run: npm run pack --prefix music-holo-desktop
      - name: Preserve desktop smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-diagnostics
          path: music-holo-desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7
