name: Desktop validation
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            music-holo-desktop/package-lock.json
            music-holo-web/package-lock.json
      - run: npm ci --prefix music-holo-web
      - run: npm ci --prefix music-holo-desktop
      - run: npm audit --prefix music-holo-desktop --audit-level=moderate
      - run: npm test --prefix music-holo-desktop
      - run: node --test examples/lx-custom-source/music-holo-local.test.cjs
      - run: npm run build:web --prefix music-holo-desktop
      - name: Electron smoke (real Chromium sandbox, mocked third-party network)
        shell: bash
        run: |
          set +e
          xvfb-run -a npm run test:smoke --prefix music-holo-desktop > /tmp/desktop-smoke.log 2>&1
          status=$?
          cat /tmp/desktop-smoke.log
          if [ "$status" -ne 0 ]; then
            # 渲染进程的 Element Plus 告警会把日志撑得很大，失败原因单独截取。
            if [ -f music-holo-desktop/test-results/failure.txt ]; then
              tail -n 60 music-holo-desktop/test-results/failure.txt >> "$GITHUB_STEP_SUMMARY"
              summary=$(head -c 6000 music-holo-desktop/test-results/failure.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            else
              tail -n 80 /tmp/desktop-smoke.log >> "$GITHUB_STEP_SUMMARY"
              summary=$(tail -n 80 /tmp/desktop-smoke.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            fi
            echo "::error title=Desktop smoke failed::$summary"
          fi
          exit "$status"
      - name: Production desktop directory packaging
        run: npm run pack --prefix music-holo-desktop
      - name: Preserve desktop smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: desktop-smoke-diagnostics
          path: music-holo-desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7
