server:
  port: 8080

spring:
  application:
    name: music-holo-server
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:music_holo}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.musicholo.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token 权限认证配置
sa-token:
  # token 名称（同时也是 cookie / header 名称）
  token-name: music-holo-token
  # token 有效期（秒），30 天
  timeout: 2592000
  # 是否允许同一账号多地同时登录
  is-concurrent: true
  # 多地登录时是否共用一个 token
  is-share: false
  # token 风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  # 是否从 header 中读取 token
  is-read-header: true
  # 是否从 cookie 中读取 token
  is-read-cookie: false

# Knife4j API 文档配置
knife4j:
  enable: true
  production: false
  setting:
    language: zh_cn
  basic:
    enable: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false

# 自定义配置
music-holo:
  # 文件上传存储目录（音频 / 头像 / 歌词等）
  upload-path: ./upload/
